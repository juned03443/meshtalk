# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users will override the settings in this file
# with those in the IDE's preferences.
#
# For more details on how to configure your build environment visit:
# http://www.gradle.org/docs/current/user-guide.html

# Keep Gradle and Kotlin below the memory budget while Android Studio and an emulator run.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Kotlin compiles in a separate JVM; cap it to prevent native-memory exhaustion.
kotlin.daemon.jvm.options=-Xmx1024m -XX:MaxMetaspaceSize=384m

# AndroidX
android.useAndroidX=true
android.enableJetifier=false

# When configured, Gradle will run in parallel if possible.
org.gradle.parallel=true
org.gradle.caching=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
